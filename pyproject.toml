[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phydcm"
version = "3.0.0"
description = "Research-grade medical imaging utilities for DICOM workflows with optional AI inference and modular heavy dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

authors = [
  { name = "PhyDCM Team" }
]

keywords = ["DICOM", "medical imaging", "CT", "MRI", "PET", "AI", "radiology"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]

dependencies = [
  "numpy>=1.24",
  "Pillow>=9.0.0",
  "pydicom>=2.4.0"
]

[project.optional-dependencies]
ml = [
  "tensorflow>=2.13,<2.16"
]
cv = [
  "opencv-python>=4.9"
]
ui = [
  "PyQt6>=6.6.0"
]
all = [
  "tensorflow>=2.13,<2.16",
  "opencv-python>=4.9",
  "PyQt6>=6.6.0"
]

[project.urls]
Homepage = "https://github.com/PhyDCM/PhyDCM"
Repository = "https://github.com/PhyDCM/PhyDCM"
Issues = "https://github.com/PhyDCM/PhyDCM/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["phydcm*"]

[tool.setuptools.package-data]
# If you decide to ship lightweight metadata only:
phydcm = ["models/*.json"]
# NOTE: We intentionally do NOT bundle large *.keras files by default for size.
# Keep trained models in your own repo or provide a separate model package/release asset.
